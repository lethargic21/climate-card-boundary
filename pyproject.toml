[project]
name = "climate-card-did"
version = "0.2.0"
description = "기후동행카드 역별 지하철 승차 staggered DiD (한겨레×숲과나눔 공모전)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 직접 의존성은 정확히 고정한다(전이 의존성은 uv.lock). statsmodels·scipy는 서로 호환되는 조합으로 맞춘 것
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "markdown==3.10.3",  # report/build_pdf.py (보고서 md → HTML)
    "olefile==0.47",  # report/extract_template.py (주최측 HWP 양식 읽기)
]

[tool.uv]
package = false
